name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Scan reachable dependency vulnerabilities
        run: ./scripts/vulncheck.sh

      - name: Demo
        run: ./scripts/demo.sh

      - name: Verify clean checkout
        run: test -z "$(git status --porcelain)"
