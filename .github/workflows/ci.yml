name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            go.sum
            jsonataddl/go.sum

      - name: Test
        run: |
          go test ./...
          (cd jsonataddl && GOWORK=off go test ./...)

      - name: Race test
        run: |
          go test -race ./...
          (cd jsonataddl && GOWORK=off go test -race ./...)

      - name: Vet
        run: |
          go vet ./...
          (cd jsonataddl && GOWORK=off go vet ./...)

      - name: Verify module boundary
        run: |
          test "$(cd jsonataddl && GOWORK=off go list -m -f '{{.Path}}')" = 'github.com/generalbusiness-ai/tailapps/jsonataddl'
          ./scripts/check-jsonataddl-boundary.sh

      - name: Verify root public dependency and paired workspace
        run: ./scripts/check-root-module.sh

      - name: Scan reachable dependency vulnerabilities
        run: |
          ./scripts/vulncheck.sh
          (cd jsonataddl && GOWORK=off ../scripts/vulncheck.sh)

      - name: Demo
        run: ./scripts/demo.sh

      - name: Verify clean checkout
        run: test -z "$(git status --porcelain)"
