name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the immutable tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require an exact semantic-version tag
        run: |
          test "$(git describe --exact-match --tags HEAD)" = "$GITHUB_REF_NAME"
          printf '%s\n' "${GITHUB_REF_NAME#v}" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: go.sum

      - name: Verify source
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          test -z "$(git status --porcelain)"

      - name: Build release archives
        run: scripts/release.sh "$GITHUB_REF_NAME" dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Keylessly sign release checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.bundle --output-signature dist/checksums.txt.sig dist/checksums.txt

      - name: Attest release archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.tar.gz'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Tailapps $GITHUB_REF_NAME" --generate-notes
