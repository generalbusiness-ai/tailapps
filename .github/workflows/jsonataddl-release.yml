name: jsonataddl release

on:
  push:
    tags:
      - 'jsonataddl/v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the immutable tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a merged exact module-version tag
        run: |
          git tag --points-at HEAD | grep -Fxq "$GITHUB_REF_NAME"
          printf '%s\n' "${GITHUB_REF_NAME#jsonataddl/v}" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
          cache-dependency-path: jsonataddl/go.sum

      - name: Verify module
        working-directory: jsonataddl
        run: |
          GOWORK=off go mod tidy
          GOWORK=off go test ./...
          GOWORK=off go test -race ./...
          GOWORK=off go vet ./...
          test "$(GOWORK=off go list -m -f '{{.Path}}')" = 'github.com/generalbusiness-ai/tailapps/jsonataddl'
          if GOWORK=off go list -deps -test ./... | grep '^github.com/generalbusiness-ai/tailapps/' | grep -Ev '^github.com/generalbusiness-ai/tailapps/jsonataddl(_test)?([/. ]|$)'; then
            echo 'jsonataddl tests and production code must not depend on Tailapps packages outside jsonataddl' >&2
            exit 1
          fi
          GOWORK=off ../scripts/vulncheck.sh
          test -z "$(git status --porcelain)"
